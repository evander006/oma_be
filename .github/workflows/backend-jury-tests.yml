name: Backend jury demo tests

on:
  push:
    branches:
      - demo/android-jury-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile backend Python
        run: python -m compileall -q backend/app
      - name: Test all backend flows
        run: PYTHONPATH=backend python -m pytest -q backend/tests
