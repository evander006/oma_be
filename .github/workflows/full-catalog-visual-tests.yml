name: Verify full-catalog visual search
on:
  push:
    branches: [feat/full-catalog-visual-index]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-search-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install API/test dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend/app backend/scripts
      - name: Run visual search unit and regression tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_visual_search.py backend/tests/test_full_catalog_visual.py backend/tests/test_visual_benchmark.py backend/tests/test_visual_index_builder.py
