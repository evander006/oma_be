services:
  - type: web
    name: oma-dom-api
    runtime: docker
    plan: free
    branch: codex/digital-home-ecosystem
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEV_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: qwen/qwen2.5-vl-3b-instruct:free,nvidia/nemotron-nano-12b-v2-vl:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////app/data/oma_dom.db
